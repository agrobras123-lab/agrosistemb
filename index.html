<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f7a33" />
  <title>Agro Bras Hortifruti</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="locked">

  <!-- ===================== TELA DE PIN ===================== -->
  <div id="pin-screen" class="pin-screen">
    <div class="pin-logo">
      <img src="./assets/icon-512.png" alt="Agro Bras" />
      <div class="nome">Agro Bras Hortifruti</div>
      <div class="sub">Largo do Pari 330 · Box 57-62 · São Paulo</div>
    </div>
    <div class="pin-prompt">Digite o PIN de acesso</div>
    <div id="pin-dots" class="pin-dots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <div id="pin-error" class="pin-error" aria-live="polite"></div>
    <div id="pin-pad" class="pin-pad">
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="pad-empty" tabindex="-1"></button>
      <button data-key="0">0</button>
      <button class="pad-back" data-key="back" aria-label="Apagar">⌫</button>
    </div>
  </div>

  <!-- ===================== SHELL DO APP ===================== -->
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <img src="./assets/icon-192.png" alt="" />
        <div>
          <div class="brand-name">Agro Bras</div>
          <div class="brand-sub">Hortifruti</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav-link" data-route="inicio"     href="#/inicio"><span class="ico">🏠</span> Início</a>
        <a class="nav-link" data-route="vendas"     href="#/vendas"><span class="ico">🛒</span> Vendas</a>
        <a class="nav-link" data-route="compras"    href="#/compras"><span class="ico">📦</span> Compras</a>
        <a class="nav-link" data-route="cadastros"  href="#/cadastros"><span class="ico">📇</span> Cadastros</a>
        <a class="nav-link" data-route="relatorios" href="#/relatorios"><span class="ico">📊</span> Relatórios</a>
      </nav>
      <div class="sidebar-foot">Agro Bras Hortifruti · v0 (Etapa 0)</div>
    </aside>

    <div class="content">
      <header class="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="Menu">☰</button>
        <span id="topbar-title">Início</span>
        <span class="topbar-spacer"></span>
        <button id="install-btn" class="btn btn-ghost btn-sm hidden">⤓ Instalar app</button>
        <button id="lock-btn" class="icon-btn" aria-label="Travar">🔒</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="scrim" class="scrim"></div>

  <!-- Área isolada para impressão térmica 80mm (preenchida sob demanda) -->
  <div id="area-impressao"></div>

  <!-- ===================== SCRIPTS ===================== -->
  <!-- Cliente Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/pin.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/cupom.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/cadastros.js"></script>
  <script src="./js/vendas.js"></script>
  <script src="./js/compras.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/relatorios.js"></script>
</body>
</html>
